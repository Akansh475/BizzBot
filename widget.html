<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BizBot Widget</title>
</head>
<body>

<!--
  ╔══════════════════════════════════════════════╗
  ║           CONFIGURE YOUR BOT HERE           ║
  ╚══════════════════════════════════════════════╝

<script>
  const BOT_NAME    = "Himalayan Kitchen";
  const BOT_COLOR   = "#E85D26";        // Your brand colour
  const BUSINESS_ID = "himalayan_kitchen";
  const API_URL     = "http://localhost:5000";
</script>

<!-- ─── STYLES ─────────────────────────────────────────────────────────── -->
<style>
  /* CSS variables — adapts to light and dark browser themes */
  :root {
    --brand:        #E85D26;
    --bg-panel:     #ffffff;
    --bg-header:    #ffffff;
    --bg-user-msg:  var(--brand);
    --bg-bot-msg:   #f0f0f0;
    --bg-input:     #f7f7f7;
    --text-main:    #1a1a1a;
    --text-muted:   #888888;
    --text-on-brand:#ffffff;
    --border:       #e8e8e8;
    --radius-panel: 16px;
    --radius-bubble:18px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-panel:   #1e1e1e;
      --bg-header:  #1e1e1e;
      --bg-bot-msg: #2a2a2a;
      --bg-input:   #2a2a2a;
      --text-main:  #f0f0f0;
      --text-muted: #888888;
      --border:     #333333;
    }
  }

  /* ── Reset ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Floating button ── */
  #chat-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--brand);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  #chat-toggle:hover { transform: scale(1.08); }
  #chat-toggle svg   { width: 26px; height: 26px; fill: #fff; }

  /* ── Chat panel ── */
  #chat-panel {
    position: fixed;
    bottom: 92px;
    right: 24px;
    width: 360px;
    height: 500px;
    background: var(--bg-panel);
    border-radius: var(--radius-panel);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 9998;
    font-family: var(--font);
    font-size: 14px;
    color: var(--text-main);

    /* hidden by default */
    opacity: 0;
    transform: translateY(16px) scale(0.97);
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  #chat-panel.open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: all;
  }

  /* ── Header ── */
  #chat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-header);
    flex-shrink: 0;
  }
  #chat-header .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #chat-header .avatar svg { width: 18px; height: 18px; fill: #fff; }
  #chat-header .info { flex: 1; }
  #chat-header .bot-name {
    font-weight: 600;
    font-size: 14px;
    color: var(--text-main);
  }
  #chat-header .status {
    font-size: 11px;
    color: #4caf50;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #chat-header .status::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4caf50;
    display: inline-block;
  }
  #chat-close {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    padding: 4px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  #chat-close:hover { background: var(--border); }
  #chat-close svg { width: 18px; height: 18px; }

  /* ── Messages area ── */
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  #chat-messages::-webkit-scrollbar { width: 4px; }
  #chat-messages::-webkit-scrollbar-track { background: transparent; }
  #chat-messages::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }

  /* ── Message bubbles ── */
  .msg-row {
    display: flex;
    flex-direction: column;
    max-width: 80%;
  }
  .msg-row.user { align-self: flex-end; align-items: flex-end; }
  .msg-row.bot  { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 10px 14px;
    border-radius: var(--radius-bubble);
    line-height: 1.5;
    word-break: break-word;
  }
  .msg-row.user .bubble {
    background: var(--bg-user-msg);
    color: var(--text-on-brand);
    border-bottom-right-radius: 4px;
  }
  .msg-row.bot .bubble {
    background: var(--bg-bot-msg);
    color: var(--text-main);
    border-bottom-left-radius: 4px;
  }

  /* ── Typing indicator ── */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px 14px;
    background: var(--bg-bot-msg);
    border-radius: var(--radius-bubble);
    border-bottom-left-radius: 4px;
    width: fit-content;
  }
  .typing-indicator span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    display: inline-block;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30%           { transform: translateY(-5px); }
  }

  /* ── Lead capture form ── */
  .lead-form {
    margin-top: 8px;
    background: var(--bg-bot-msg);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border: 1px solid var(--border);
  }
  .lead-form p {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .lead-form input {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    color: var(--text-main);
    font-family: var(--font);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  .lead-form input:focus { border-color: var(--brand); }
  .lead-form button {
    padding: 9px;
    border-radius: 8px;
    border: none;
    background: var(--brand);
    color: #fff;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .lead-form button:hover { opacity: 0.88; }

  .confirmation-msg {
    font-size: 13px;
    color: #4caf50;
    font-weight: 500;
    padding: 6px 0;
  }

  /* ── Input row ── */
  #chat-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-panel);
    flex-shrink: 0;
  }
  #chat-input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-main);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  #chat-input:focus { border-color: var(--brand); }
  #chat-input::placeholder { color: var(--text-muted); }

  #chat-send {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: var(--brand);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s, transform 0.15s;
  }
  #chat-send:hover  { opacity: 0.88; transform: scale(1.05); }
  #chat-send:active { transform: scale(0.96); }
  #chat-send svg    { width: 17px; height: 17px; fill: #fff; }

  /* ── Mobile: full screen ── */
  @media (max-width: 480px) {
    #chat-panel {
      bottom: 0; right: 0;
      width: 100vw;
      height: 100dvh;
      border-radius: 0;
      border: none;
    }
    #chat-toggle { bottom: 16px; right: 16px; }
  }
</style>

<!-- ─── HTML ──────────────────────────────────────────────────────────── -->

<!-- Floating toggle button -->
<button id="chat-toggle" aria-label="Open chat">
  <!-- Chat icon -->
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2z"/>
  </svg>
</button>

<!-- Chat panel -->
<div id="chat-panel" role="dialog" aria-label="Chat">

  <!-- Header -->
  <div id="chat-header">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2z"/></svg>
    </div>
    <div class="info">
      <div class="bot-name" id="header-bot-name">Bot</div>
      <div class="status">Online</div>
    </div>
    <button id="chat-close" aria-label="Close chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Messages -->
  <div id="chat-messages"></div>

  <!-- Input row -->
  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off"/>
    <button id="chat-send" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>

</div>

<!-- ─── JAVASCRIPT ────────────────────────────────────────────────────── -->
<script>
  // ── Apply config variables ──────────────────────────────────────────
  document.documentElement.style.setProperty('--brand', BOT_COLOR);
  document.getElementById('header-bot-name').textContent = BOT_NAME;

  // ── Generate a random session ID for this page load ─────────────────
  // This keeps each browser tab's conversation separate
  const SESSION_ID = 'sess_' + Math.random().toString(36).slice(2, 11);

  // Track whether we've already shown the lead form this session
  let leadFormShown = false;

  // ── DOM references ───────────────────────────────────────────────────
  const panel     = document.getElementById('chat-panel');
  const toggle    = document.getElementById('chat-toggle');
  const closeBtn  = document.getElementById('chat-close');
  const messages  = document.getElementById('chat-messages');
  const input     = document.getElementById('chat-input');
  const sendBtn   = document.getElementById('chat-send');

  // ── Open / close panel ───────────────────────────────────────────────
  toggle.addEventListener('click', () => {
    panel.classList.add('open');
    input.focus();
  });

  closeBtn.addEventListener('click', () => {
    panel.classList.remove('open');
  });

  // ── Send on Enter key ────────────────────────────────────────────────
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  // ── Scroll to the bottom of the messages area ────────────────────────
  function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  // ── Add a message bubble to the chat ─────────────────────────────────
  // role: 'user' or 'bot'
  // Returns the row element so we can append things below it (like forms)
  function addMessage(text, role) {
    const row    = document.createElement('div');
    row.className = `msg-row ${role}`;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    row.appendChild(bubble);
    messages.appendChild(row);
    scrollToBottom();
    return row;
  }

  // ── Show the "Typing..." dots while waiting for a response ────────────
  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>`;
    messages.appendChild(row);
    scrollToBottom();
  }

  function hideTyping() {
    const row = document.getElementById('typing-row');
    if (row) row.remove();
  }

  // ── Show the lead capture form below a bot message row ───────────────
  function showLeadForm(afterRow) {
    if (leadFormShown) return; // only show once per session
    leadFormShown = true;

    const form = document.createElement('div');
    form.className = 'lead-form';
    form.innerHTML = `
      <p>Leave your details and our team will get back to you:</p>
      <input type="text"  id="lead-name"  placeholder="Your name"         />
      <input type="tel"   id="lead-phone" placeholder="Phone number"      />
      <button id="lead-submit">Send my details</button>
    `;

    afterRow.appendChild(form);
    scrollToBottom();

    // Handle form submit
    document.getElementById('lead-submit').addEventListener('click', submitLead);
  }

  // ── Submit lead data to the backend ──────────────────────────────────
  async function submitLead() {
    const name  = document.getElementById('lead-name').value.trim();
    const phone = document.getElementById('lead-phone').value.trim();

    if (!name || !phone) {
      alert('Please enter both your name and phone number.');
      return;
    }

    // Replace form with a confirmation message
    const form = document.querySelector('.lead-form');
    form.innerHTML = `<p class="confirmation-msg">✅ Thanks! The team will reach out shortly.</p>`;

    // POST the lead data to the backend
    // (We don't block on this — the confirmation shows immediately)
    try {
      await fetch(`${API_URL}/capture-lead`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name,
          phone,
          session_id:  SESSION_ID,
          business_id: BUSINESS_ID,
        }),
      });
    } catch (err) {
      // Silently fail — the user already saw the confirmation
      console.error('Lead capture error:', err);
    }
  }

  // ── Main send function ───────────────────────────────────────────────
  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    // Show user's message and clear the input
    addMessage(text, 'user');
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;

    // Show typing indicator
    showTyping();

    try {
      // POST to the Flask backend
      const response = await fetch(`${API_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message:     text,
          session_id:  SESSION_ID,
          business_id: BUSINESS_ID,
        }),
      });

      // Parse the JSON response
      const data = await response.json();

      hideTyping();

      if (!response.ok) {
        // Backend returned an error
        addMessage('Sorry, something went wrong. Please try again.', 'bot');
        return;
      }

      // Show the bot's reply
      const botRow = addMessage(data.reply, 'bot');

      // If the bot can't answer → show lead capture form
      if (data.needs_handoff && !leadFormShown) {
        showLeadForm(botRow);
      }

    } catch (err) {
      // Network error (e.g. server not running)
      hideTyping();
      addMessage("Couldn't reach the server. Is it running on port 5000?", 'bot');
      console.error('Fetch error:', err);

    } finally {
      // Re-enable input regardless of success or failure
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // ── Show a welcome message when the page loads ───────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    addMessage(`Hi! I'm the ${BOT_NAME} assistant. How can I help you today? 👋`, 'bot');
  });
</script>

</body>
</html>
